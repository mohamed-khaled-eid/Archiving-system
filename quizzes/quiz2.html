  <style>
    /* تنسيق عام للصفحة */
body {
  font-family: "Cairo", sans-serif;
  direction: rtl;
  background-color: #f4f7fc;
  margin: 0;
  padding: 0;
}

/* حاوية الامتحان */
.exam-container {
  max-width: 800px;
  background: #fff;
  margin: 40px auto;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
}

/* العنوان */
.exam-container h1 {
  text-align: center;
  color: #333;
  margin-bottom: 10px;
}

/* المؤقت */
.timer {
  text-align: center;
  font-size: 18px;
  margin-bottom: 25px;
  color: #007bff;
}

/* كل سؤال */
.question {
  margin-bottom: 25px;
  background-color: #f9f9f9;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #ddd;
  direction: ltr;
}

/* عنوان السؤال */
.question h3 {
  margin-bottom: 10px;
  color: #333;
}

/* الاختيارات */
.question label {
  display: block;
  margin: 5px 0;
  cursor: pointer;
}

/* الحقول النصية والمقالية */
input[type="text"], textarea {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 8px;
  outline: none;
  transition: border-color 0.3s;
}

input[type="text"]:focus, textarea:focus {
  border-color: #007bff;
}

/* زر التسليم */
#submitBtn {
  display: block;
  margin: 20px auto;
  padding: 12px 25px;
  background-color: #007bff;
  color: white;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.3s;
}

#submitBtn:hover {
  background-color: #0056b3;
}

/* النتيجة */
#result {
  margin-top: 30px;
  background-color: #e9f7ef;
  border: 1px solid #b2dfdb;
  border-radius: 10px;
  padding: 20px;
}

.hidden {
  display: none;
}

/* تنسيق النتيجة والتفسير */
.answer-result {
  margin-top: 15px;
  background-color: #f1f1f1;
  padding: 10px;
  border-radius: 8px;
}

.correct {
  color: green;
  font-weight: bold;
}

.wrong {
  color: red;
  font-weight: bold;
}

  </style>

// ---------------------------
// توليد الأسئلة تلقائيًا
// ---------------------------
function renderQuestions() {
  questions.forEach((q, i) => {
    const index = i + 1;
    let html = `<div class="question"><h3>${index}. ${q.question}</h3>`;

    if (q.type === "mcq") {
      q.options.forEach(opt => {
        html += `
          <label><input type="radio" name="q${index}" value="${opt}"> ${opt}</label>
        `;
      });
    } else if (q.type === "fill") {
      html += `<input type="text" name="q${index}" placeholder="اكتب إجابتك هنا">`;
    } else if (q.type === "truefalse") {
      html += `
        <label><input type="radio" name="q${index}" value="true"> true</label>
        <label><input type="radio" name="q${index}" value="false"> false</label>
      `;
    } else if (q.type === "essay") {
      html += `<textarea name="q${index}" rows="3" placeholder="اكتب إجابتك هنا"></textarea>`;
    }

    html += `</div>`;
    form.insertAdjacentHTML("beforeend", html);
  });
}
renderQuestions();

// ---------------------------
// تحميل البيانات المحفوظة
// ---------------------------
function loadSavedData() {
  const savedTime = localStorage.getItem("remainingTime");
  const savedAnswers = JSON.parse(localStorage.getItem("examAnswers"));

  if (savedTime) totalSeconds = parseInt(savedTime);
  if (savedAnswers) {
    for (const [key, value] of Object.entries(savedAnswers)) {
      const input = form.elements[key];
      if (!input) continue;
      if (input.type === "radio") {
        const radios = form.querySelectorAll(`[name="${key}"]`);
        radios.forEach(r => { if (r.value === value) r.checked = true; });
      } else input.value = value;
    }
  }
}

// ---------------------------
// حفظ الإجابات أول بأول
// ---------------------------
form.addEventListener("input", () => {
  const answers = {};
  for (let element of form.elements) {
    if (!element.name) continue;
    if (element.type === "radio") {
      if (element.checked) answers[element.name] = element.value;
    } else answers[element.name] = element.value;
  }
  localStorage.setItem("examAnswers", JSON.stringify(answers));
});

// ---------------------------
// تشغيل المؤقت
// ---------------------------
function startTimer() {
  timer = setInterval(() => {
    totalSeconds--;
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    timeDisplay.textContent = `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
    localStorage.setItem("remainingTime", totalSeconds);

    if (totalSeconds <= 0) {
      clearInterval(timer);
      alert("انتهى الوقت! سيتم تسليم الامتحان تلقائيًا.");
      submitBtn.click();
    }
  }, 1000);
}

// ---------------------------
// عند التسليم
// ---------------------------
submitBtn.addEventListener("click", () => {
  clearInterval(timer);
  resultDiv.classList.remove("hidden");
  resultDiv.innerHTML = "";

  let score = 0;
  const total = questions.length;

  questions.forEach((q, i) => {
    const name = "q" + (i + 1);
    const userAnswer = form[name]?.value?.trim().toLowerCase();
    const correct = q.answer.toLowerCase();

    let isCorrect = false;
    if (["mcq", "fill", "truefalse"].includes(q.type)) {
      if (userAnswer === correct) {
        isCorrect = true;
        score++;
      }
    } else if (q.type === "essay") {
      if (userAnswer) score += 0.5; // نص درجة للمحاولة
    }

    resultDiv.innerHTML += `
      <div class="answer-result">
        <p><strong>السؤال ${i + 1}:</strong> 
        ${isCorrect ? "<span class='correct'>✔️ إجابتك صحيحة</span>" : "<span class='wrong'>❌ إجابتك خاطئة</span>"}</p>
        <p>إجابتك: ${userAnswer || "<em>لم تجب</em>"}</p>
        <p>الإجابةالصحيحة: <b>${q.answer}</b></p>
        <p>💬 التفسير: ${q.explanation}</p>
      </div>
    `;
  });

  const percentage = Math.round((score / total) * 100);
  resultDiv.innerHTML = `<h2>درجتك: ${score} من ${total} (${percentage}%)</h2>` + resultDiv.innerHTML;

  localStorage.removeItem("remainingTime");
  localStorage.removeItem("examAnswers");
});

// ---------------------------
// بدء الامتحان
// ---------------------------
loadSavedData();
startTimer();

// ---------------------------
// تنبيه عند محاولة إغلاق الصفحة
// ---------------------------
window.addEventListener("beforeunload", (e) => {
  e.preventDefault();
  e.returnValue = "هل أنت متأكد إنك تريد الخروج؟ سيتم حفظ إجاباتك تلقائيًا.";
});
